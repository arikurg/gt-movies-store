{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h2 class="text-center mb-4">User Profile: {{ user.username }}</h2>

            <div class="text-center mb-4">
                <img class="rounded-circle border border-5" 
                     src="{{ profile.image.url }}" 
                     alt="{{ user.username }} Profile Picture" 
                     style="width: 150px; height: 150px; object-fit: cover;">
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <fieldset class="form-group border p-3 rounded">
                    <legend class="border-bottom mb-4">Upload New Picture</legend>
                    <p class="text-muted small">Current File: {{ profile.image.name }}</p>

                    {{ p_form.as_p }}

                </fieldset>
                <div class="form-group text-center mt-3">
                    <button class="btn btn-success" type="submit">Update Profile Picture</button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
